<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>倉頡字典</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="cj-header">
    <div class="cj-header-row">
      <h1>倉頡字典</h1>
      <div class="cj-theme-picker" role="radiogroup" aria-label="主題">
        <label><input type="radio" name="cj-theme" value="light">淺色</label>
        <label><input type="radio" name="cj-theme" value="dark">深色</label>
        <label><input type="radio" name="cj-theme" value="system">系統</label>
      </div>
    </div>
    <p class="cj-hint">輸入或貼上中文字，自動拆出倉頡碼與字根</p>
  </header>

  <section class="cj-input-section">
    <textarea id="cj-input" placeholder="在此輸入中文字…" autocomplete="off" spellcheck="false"></textarea>
  </section>

  <section class="cj-results-section">
    <div id="cj-results" class="cj-results"></div>
    <div id="cj-empty" class="cj-empty">尚未輸入任何中文字</div>
  </section>

  <section id="handwriting-slot" class="cj-handwriting">
    <div class="cj-handwriting-head">
      <button type="button" id="cj-hw-toggle" class="cj-hw-toggle" aria-expanded="true" aria-controls="cj-hw-body" aria-label="切換手寫板顯示">
        <span class="cj-hw-toggle-chevron" aria-hidden="true">▾</span>
        <span class="cj-handwriting-title">手寫輸入</span>
      </button>
      <span class="cj-handwriting-privacy" title="筆跡會傳送至 Google Input Tools 進行辨識">筆跡會傳送至 Google 辨識</span>
    </div>
    <div id="cj-hw-body" class="cj-hw-body">
      <div class="cj-canvas-wrap">
        <canvas id="cj-canvas"></canvas>
        <div id="cj-canvas-placeholder" class="cj-canvas-placeholder">在此書寫…</div>
      </div>
      <div class="cj-hw-toolbar">
        <button type="button" id="cj-hw-undo" disabled>復原</button>
        <button type="button" id="cj-hw-clear" disabled>清除</button>
        <span id="cj-hw-status" class="cj-hw-status" role="status" aria-live="polite"></span>
      </div>
      <div id="cj-hw-candidates" class="cj-hw-candidates" aria-label="候選字"></div>
    </div>
  </section>

  <script src="lib/cangjie-core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
