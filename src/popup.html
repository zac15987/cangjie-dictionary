<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>倉頡字典</title>
  <style>
    [data-theme="light"] {
      --cj-bg: #fff;
      --cj-bg-elev: #fff;
      --cj-text: #222;
      --cj-text-dim: #555;
      --cj-border: #eee;
      --cj-border-soft: #f5f5f5;
      --cj-input-border: #d0d0d0;
      --cj-accent: #4285f4;
      --cj-accent-soft: rgba(66, 133, 244, 0.15);
      --cj-error: #d93025;
      --cj-missing: #bbb;
    }
    [data-theme="dark"] {
      --cj-bg: #1e1e1e;
      --cj-bg-elev: #2a2a2a;
      --cj-text: #e8e8e8;
      --cj-text-dim: #a8a8a8;
      --cj-border: #3a3a3a;
      --cj-border-soft: #333;
      --cj-input-border: #4a4a4a;
      --cj-accent: #8ab4f8;
      --cj-accent-soft: rgba(138, 180, 248, 0.18);
      --cj-error: #f28b82;
      --cj-missing: #666;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 12px 14px;
      font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      font-size: 13px;
      color: var(--cj-text);
      background: var(--cj-bg);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
    }
    #cj-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 15px;
      font-family: 'Microsoft JhengHei', 'PingFang TC', serif;
      border: 1px solid var(--cj-input-border);
      border-radius: 4px;
      outline: none;
      background: var(--cj-bg-elev);
      color: var(--cj-text);
    }
    #cj-input:focus {
      border-color: var(--cj-accent);
      box-shadow: 0 0 0 2px var(--cj-accent-soft);
    }
    .cj-results {
      margin-top: 8px;
      max-height: 280px;
      overflow-y: auto;
    }
    .cj-row {
      display: grid;
      grid-template-columns: auto auto 1fr;
      column-gap: 12px;
      align-items: baseline;
      padding: 4px 0;
    }
    .cj-row + .cj-row {
      border-top: 1px solid var(--cj-border-soft);
    }
    .cj-char {
      font-size: 20px;
      color: var(--cj-text);
      line-height: 1.2;
      font-family: 'Microsoft JhengHei', 'PingFang TC', serif;
    }
    .cj-code {
      font-size: 14px;
      color: var(--cj-accent);
      font-weight: bold;
      letter-spacing: 2px;
      font-family: 'Consolas', 'Menlo', monospace;
    }
    .cj-roots {
      font-size: 15px;
      color: var(--cj-text-dim);
      letter-spacing: 4px;
    }
    .cj-missing {
      font-size: 12px;
      color: var(--cj-missing);
      grid-column: 2 / span 2;
    }
    .cj-error {
      font-size: 12px;
      color: var(--cj-error);
      margin-top: 6px;
    }
    .cj-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--cj-border);
      display: flex;
      justify-content: flex-end;
    }
    #cj-open-sidepanel {
      background: none;
      border: none;
      color: var(--cj-accent);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 4px;
    }
    #cj-open-sidepanel:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>倉頡字典</h1>
  <input id="cj-input" type="text" placeholder="輸入中文字…" autocomplete="off" spellcheck="false">
  <div id="cj-results" class="cj-results"></div>
  <div class="cj-footer">
    <button id="cj-open-sidepanel" type="button">在側邊欄開啟 →</button>
  </div>

  <script src="lib/cangjie-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
