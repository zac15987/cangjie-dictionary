<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ink black seal body -->
  <rect width="128" height="128" rx="22" fill="#1a1614"/>
  <!-- gold double-line frame -->
  <rect x="9" y="9" width="110" height="110" rx="15"
        fill="none" stroke="#d4a548" stroke-width="2.5" opacity="0.95"/>
  <rect x="14" y="14" width="100" height="100" rx="11"
        fill="none" stroke="#d4a548" stroke-width="1" opacity="0.45"/>
  <!-- four cangjie radicals at corners in cream -->
  <g font-family="'Noto Serif TC','Source Han Serif TC','Songti TC',serif"
     font-size="13" font-weight="700" fill="#f4e8d0" text-anchor="middle" opacity="0.92">
    <text x="26" y="32">人</text>
    <text x="102" y="32">戈</text>
    <text x="26" y="108">日</text>
    <text x="102" y="108">口</text>
  </g>
  <!-- cinnabar accent dots between each corner radical and center -->
  <g fill="#c0392b">
    <circle cx="38" cy="38" r="1.6" opacity="0.85"/>
    <circle cx="90" cy="38" r="1.6" opacity="0.85"/>
    <circle cx="38" cy="90" r="1.6" opacity="0.85"/>
    <circle cx="90" cy="90" r="1.6" opacity="0.85"/>
  </g>
  <!-- center 倉 in gold -->
  <text x="64" y="84"
        font-family="'Noto Serif TC','Source Han Serif TC','Songti TC','SimSun',serif"
        font-size="72" font-weight="700" fill="#d4a548"
        text-anchor="middle">倉</text>
</svg>
