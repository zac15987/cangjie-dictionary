<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- aged paper body -->
  <rect width="128" height="128" rx="22" fill="#f4e8d0"/>
  <!-- subtle paper grain -->
  <g fill="#c9b489" opacity="0.22">
    <circle cx="32" cy="44" r="0.7"/>
    <circle cx="88" cy="40" r="0.7"/>
    <circle cx="46" cy="88" r="0.7"/>
    <circle cx="82" cy="96" r="0.6"/>
    <circle cx="22" cy="72" r="0.6"/>
    <circle cx="102" cy="78" r="0.6"/>
    <circle cx="60" cy="22" r="0.5"/>
    <circle cx="70" cy="106" r="0.5"/>
  </g>
  <!-- ink double-line frame with cinnabar inner line -->
  <rect x="9" y="9" width="110" height="110" rx="15"
        fill="none" stroke="#1a1614" stroke-width="2.5"/>
  <rect x="14" y="14" width="100" height="100" rx="11"
        fill="none" stroke="#a23829" stroke-width="1" opacity="0.80"/>
  <!-- four cangjie radicals at corners, in ink -->
  <g font-family="'Noto Serif TC','Source Han Serif TC','Songti TC',serif"
     font-size="13" font-weight="700" fill="#1a1614" text-anchor="middle">
    <text x="26" y="32">人</text>
    <text x="102" y="32">戈</text>
    <text x="26" y="108">日</text>
    <text x="102" y="108">口</text>
  </g>
  <!-- center 倉 in ink -->
  <text x="64" y="84"
        font-family="'Noto Serif TC','Source Han Serif TC','Songti TC','SimSun',serif"
        font-size="72" font-weight="700" fill="#1a1614"
        text-anchor="middle">倉</text>
</svg>
